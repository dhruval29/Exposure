<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Observation Table</title>
<style>
  body {
    font-family: sans-serif;
  }
  table {
    border-collapse: collapse;
    width: 100%;
    border: 1px solid #333;
  }
  th, td {
    border: 1px solid #333;
    padding: 8px;
    text-align: center;
  }
  th {
    background-color: #f2f2f2;
    font-weight: bold;
  }
  .sub-header {
    font-weight: normal;
    font-style: italic;
  }
</style>
</head>
<body>

<h2>Observation Data</h2>

<table>
  <thead>
    <tr>
      <th colspan="4">Measured</th>
      <th colspan="4">Calculated</th>
    </tr>
    <tr>
      <th>
        <i>n</i><br>Speed<br><span class="sub-header">in min<sup>-1</sup></span>
      </th>
      <th>
        <i>F</i><br>Braking force<br><span class="sub-header">in N</span>
      </th>
      <th>
        <i>M</i><br>Torque on the shaft<br><span class="sub-header">in Nm</span>
      </th>
      <th>
        <i>P</i><sub>out</sub><br>Power on the shaft<br><span class="sub-header">in W</span>
      </th>
      <th>
        <i>P</i><sub>hyd</sub><br>Hydraulic power<br><span class="sub-header">in W</span>
      </th>
      <th>
        <i>η</i><br>Efficiency<br><span class="sub-header">in %</span>
      </th>
      <th colspan="2">
        <i>η'</i><br>Efficiency without shaft seal ring<br><span class="sub-header">in %</span>
      </th>
    </tr>
  </thead>
  <tbody>
    <!-- 8 empty rows for data entry -->
    <tr>
      <td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td><td colspan="2">&nbsp;</td>
    </tr>
    <tr>
      <td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td><td colspan="2">&nbsp;</td>
    </tr>
    <tr>
      <td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td><td colspan="2">&nbsp;</td>
    </tr>
    <tr>
      <td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td><td colspan="2">&nbsp;</td>
    </tr>
    <tr>
      <td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td><td colspan="2">&nbsp;</td>
    </tr>
    <tr>
      <td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td><td colspan="2">&nbsp;</td>
    </tr>
    <tr>
      <td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td><td colspan="2">&nbsp;</td>
    </tr>
    <tr>
      <td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td><td colspan="2">&nbsp;</td>
    </tr>
  </tbody>
</table>

</body>
</html>
